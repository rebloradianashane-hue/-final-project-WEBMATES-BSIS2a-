<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AtudTA Wet Market Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#ECFDF5',
                            100: '#D1FAE5',
                            200: '#A7F3D0',
                            500: '#10B981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065F46',
                        },
                        spink: {
                            50: '#FFF1F6',
                            100: '#FFE4E6',
                            200: '#FECDD3',
                            400: '#FB7185',
                            600: '#E11D48',
                            700: '#BE123C',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-app-page="login" class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- TOP HEADER -->
    <header class="bg-[#059669] text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-spink-400 flex items-center justify-center text-white shadow-lg text-xl font-bold">
                    <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2">
                        AtudTA <span class="text-xs px-2 py-0.5 rounded-full bg-spink-400 text-white font-semibold">Polangui</span>
                    </h1>
                    <p class="text-xs text-white">Local Wet Market Delivery System</p>
                </div>
            </div>

            <!-- Header Right Info & Session controls -->
            <div id="headerUserInfo" class="flex items-center gap-3">
                <span id="headerUserLabel" class="text-sm font-medium text-white hidden sm:inline">Delivery Management System</span>
                <div id="headerAuthButtons" class="flex items-center gap-2">
                    <!-- Dynamic Buttons Added JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed top-20 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- ========================================== -->
        <!-- 1. LOGIN SCREEN                            -->
        <!-- ========================================== -->
        <section id="loginPage" class="max-w-md mx-auto my-10 glass-card p-8 rounded-2xl shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-spink-50 rounded-2xl text-spink-600 flex items-center justify-center text-2xl mx-auto mb-3">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2 class="text-2xl font-bold text-sage-800">Welcome Back!</h2>
                <p class="text-sm text-slate-500">Log in to your AtudTA Wet Market account.</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="loginEmail" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
                    <input id="loginEmail" type="email" autocomplete="email" placeholder="juan@gmail.com" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-spink-400 focus:outline-none transition">
                </div>

                <div>
                    <label for="loginPassword" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <div class="flex rounded-xl border border-slate-300 focus-within:ring-2 focus-within:ring-spink-400">
                        <input id="loginPassword" type="password" placeholder="••••••••" required
                            class="w-full px-4 py-2.5 rounded-l-xl focus:outline-none transition">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" class="px-4 text-slate-500 hover:text-slate-800" aria-label="Show password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button id="loginSubmitButton" type="submit" disabled class="w-full py-3 bg-slate-300 text-slate-500 cursor-not-allowed font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>

            <p id="loginMessage" class="mt-4 text-sm text-center font-medium text-red-500"></p>

            <div class="mt-6 pt-6 border-t border-slate-200 text-center text-sm text-slate-600">
                Don't have an account? 
                <button onclick="showPage('signupPage')" class="text-spink-600 font-bold hover:underline ml-1">Sign Up</button>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 2. SIGN UP SCREEN                          -->
        <!-- ========================================== -->

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#059669] text-white py-6 border-t border-[#047857] mt-12 text-center text-xs">
        <p>&copy; 2026 AtudTA Wet Market Platform. Polangui, Albay Philippines. All Rights Reserved.</p>
    </footer>

    <!-- JAVASCRIPT APP ENGINE -->
    <script src="app.js" defer></script>
</body>
</html>
